<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROGERS DVD Bounce</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: #111;
    font-family: 'Arial Black', Arial, sans-serif;
    height: 100vh;
    position: relative;
  }

  #rogers {
    position: absolute;
    font-size: 60px;
    font-weight: bold;
    color: #00ffcc;
    cursor: pointer;
    user-select: none;
    text-decoration: underline thick #00ffcc;
    text-shadow: 3px 3px 0 #0ff, 6px 6px 0 #00aabb;
    transform-style: preserve-3d;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .popup {
    position: absolute;
    font-size: 20px;
    font-weight: bold;
    color: yellow;
    pointer-events: none;
    opacity: 1;
    transition: opacity 1s ease-out, transform 1s ease-out;
    text-shadow: 1px 1px 2px black;
  }
</style>
</head>
<body>

<div id="rogers">ROGERS</div>

<script>
const rogers = document.getElementById('rogers');
let dx = 3;
let dy = 3;
let bouncing = false;

// Initialize starting position after element is rendered
let x = (window.innerWidth - rogers.offsetWidth) / 2;
let y = (window.innerHeight - rogers.offsetHeight) / 2;
rogers.style.left = x + 'px';
rogers.style.top = y + 'px';

// Random color generator
function getRandomColor() {
  const letters = '0123456789ABCDEF';
  let color = '#';
  for (let i = 0; i < 6; i++) color += letters[Math.floor(Math.random() * 16)];
  return color;
}

// Popup effect
function showPopup(text, px, py) {
  const popup = document.createElement('div');
  popup.className = 'popup';
  popup.textContent = text;
  popup.style.left = px + 'px';
  popup.style.top = py + 'px';
  document.body.appendChild(popup);

  requestAnimationFrame(() => {
    popup.style.transform = 'translateY(-50px)';
    popup.style.opacity = '0';
  });

  setTimeout(() => popup.remove(), 1000);
}

rogers.addEventListener('click', () => {
  if (!bouncing) {
    bouncing = true;
    animate();
  }
});

function animate() {
  if (!bouncing) return;

  x += dx;
  y += dy;

  let hitWall = false;

  if (x + rogers.offsetWidth > window.innerWidth || x < 0) {
    dx = -dx;
    hitWall = true;
  }
  if (y + rogers.offsetHeight > window.innerHeight || y < 0) {
    dy = -dy;
    hitWall = true;
  }

  if (hitWall) {
    rogers.style.color = getRandomColor();
    showPopup("Wheres my Muscle Milk!", x + rogers.offsetWidth / 2, y);
  }

  rogers.style.left = x + 'px';
  rogers.style.top = y + 'px';

  requestAnimationFrame(animate);
}

// Keep it in bounds on resize
window.addEventListener('resize', () => {
  if (x + rogers.offsetWidth > window.innerWidth) x = window.innerWidth - rogers.offsetWidth;
  if (y + rogers.offsetHeight > window.innerHeight) y = window.innerHeight - rogers.offsetHeight;
});
</script>

</body>
</html>
