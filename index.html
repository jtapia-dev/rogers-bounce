<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROGERS DVD Bounce</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: #111;
    font-family: 'Orbitron', sans-serif;
    height: 100vh;
    position: relative;
  }

  #rogers {
    position: absolute;
    font-size: 8vw;
    font-weight: 700;
    color: #00ffcc;
    cursor: pointer;
    user-select: none;
    text-shadow: 3px 3px 0 #0ff, 6px 6px 0 #00aabb;
  }

  #underline {
    position: absolute;
    height: 8px;
    background-color: #00ffcc;
    border-radius: 2px;
  }

  .popup {
    position: absolute;
    font-size: 3vw; 
    font-weight: bold;
    color: yellow;
    pointer-events: none;
    opacity: 1;
    transition: opacity 1s ease-out, transform 1s ease-out;
    text-shadow: 1px 1px 2px black;
  }

  #fullscreenBtn {
    position: fixed;
    top: 10px;
    right: 10px;
    padding: 10px 15px;
    background-color: #00ffcc;
    border: none;
    font-weight: bold;
    cursor: pointer;
    z-index: 1000;
    border-radius: 5px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<button id="fullscreenBtn">Fullscreen</button>
<div id="rogers">ROGERS</div>
<div id="underline"></div>

<!-- HERO audio -->
<audio id="heroAudio" src="HERO.mp3" preload="auto"></audio>

<script>
const rogers = document.getElementById('rogers');
const underline = document.getElementById('underline');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const heroAudio = document.getElementById('heroAudio');

let dx = 3, dy = 3;
let bouncing = false;
let isFullscreen = false;
const AUDIO_START = 7;  // seconds
const AUDIO_END = 9.5;    // seconds
let audioTimeout = null;

// Phrases
const phrases = [
  "Wheres my Muscle Milk!",
  "I am the edible inspector",
  "I love wholesale",
  "No pizza",
  "Its LULULEMON",
  "Go Celtics",
  "At Showcase...",
  "Yes I meal prep!",
  "Back to the kitchen",
  "*burps*",
  "Babe wheres my creatine? (5:15 AM)",
  "I love Papa Ginos",
  "Bar Mitzvah TIMEEE"
];

// Random color
function getRandomColor() {
  const letters = '0123456789ABCDEF';
  let color = '#';
  for (let i = 0; i < 6; i++) color += letters[Math.floor(Math.random() * 16)];
  return color;
}

// Play HERO snippet
function playHeroSnippet() {
  if (!heroAudio) return;
  heroAudio.currentTime = AUDIO_START;
  heroAudio.play();
  clearTimeout(audioTimeout);
  audioTimeout = setTimeout(() => heroAudio.pause(), (AUDIO_END - AUDIO_START) * 1000);
}

// Popup
function showPopup(text, px, py) {
  const popup = document.createElement('div');
  popup.className = 'popup';
  popup.textContent = text;
  popup.style.left = px + 'px';
  popup.style.top = py + 'px';
  document.body.appendChild(popup);

  requestAnimationFrame(() => {
    popup.style.transform = 'translateY(-50px)';
    popup.style.opacity = '0';
  });

  setTimeout(() => popup.remove(), 1000);
}

// Start centered
let x = (window.innerWidth - rogers.offsetWidth) / 2;
let y = (window.innerHeight - rogers.offsetHeight) / 2;

// Update positions
function updatePositions() {
  rogers.style.left = x + 'px';
  rogers.style.top = y + 'px';
  underline.style.left = x + 'px';
  underline.style.top = (y + rogers.offsetHeight + 5) + 'px';
  underline.style.width = rogers.offsetWidth + 'px';
}

updatePositions();

// Fullscreen toggle
fullscreenBtn.addEventListener('click', () => {
  if (!isFullscreen) {
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    isFullscreen = true;
    fullscreenBtn.textContent = "Exit Fullscreen";
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    isFullscreen = false;
    fullscreenBtn.textContent = "Fullscreen";
  }
});

// Click changes direction + color + plays snippet
rogers.addEventListener('click', () => {
  dx = -dx + (Math.random() - 0.5) * 2;
  dy = -dy + (Math.random() - 0.5) * 2;
  const newColor = getRandomColor();
  rogers.style.color = newColor;
  underline.style.backgroundColor = newColor;
  playHeroSnippet();
  if (!bouncing) { bouncing = true; animate(); }
});

function animate() {
  if (!bouncing) return;

  x += dx;
  y += dy;

  let hitWall = false;

  if (x + rogers.offsetWidth > window.innerWidth) { dx = -Math.abs(dx); hitWall = true; }
  if (x < 0) { dx = Math.abs(dx); hitWall = true; }
  if (y + rogers.offsetHeight > window.innerHeight) { dy = -Math.abs(dy); hitWall = true; }
  if (y < 0) { dy = Math.abs(dy); hitWall = true; }

  // Corner detection
  if (hitWall) {
    const newColor = getRandomColor();
    rogers.style.color = newColor;
    underline.style.backgroundColor = newColor;
    const phrase = phrases[Math.floor(Math.random() * phrases.length)];
    showPopup(phrase, x + rogers.offsetWidth / 2, y);

    const hitLeft = x <= 0;
    const hitRight = x + rogers.offsetWidth >= window.innerWidth;
    const hitTop = y <= 0;
    const hitBottom = y + rogers.offsetHeight >= window.innerHeight;

    if ((hitLeft || hitRight) && (hitTop || hitBottom)) {
      // corner hit: play snippet
      playHeroSnippet();
    }
  }

  updatePositions();
  requestAnimationFrame(animate);
}

// Keep in bounds on resize
window.addEventListener('resize', () => {
  x = Math.min(x, window.innerWidth - rogers.offsetWidth);
  y = Math.min(y, window.innerHeight - rogers.offsetHeight);
  updatePositions();
});
</script>

</body>
</html>
